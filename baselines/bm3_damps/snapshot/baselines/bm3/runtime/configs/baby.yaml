# Original BM3 authors' recommended Baby setting; no DAMPS.
dataset: baby
model: BM3
seed: 999
embedding_size: 64
feat_embed_dim: 64
n_layers: 1
dropout: 0.5
reg_weight: 0.1
cl_weight: 2.0
learning_rate: 0.001
train_batch_size: 2048
eval_batch_size: 4096
epochs: 1000
stopping_step: 20
checkpoint_every: 10
threads: 4
topk: [10, 20]
valid_metric: recall@20
use_neg_sampling: false
use_full_sampling: false
use_neighborhood_loss: false
filter_out_cod_start_users: true
end2end: false
is_multimodal_model: true
USER_ID_FIELD: userID
ITEM_ID_FIELD: itemID
NEG_PREFIX: neg__
inter_splitting_label: x_label
inter_file_name: baby.inter
vision_feature_file: image_feat.npy
text_feature_file: text_feat.npy
field_separator: "\t"
metrics: [Recall, NDCG]
save_recommended_topk: false
