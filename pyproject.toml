[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mmrecsys"
version = "0.1.0"
description = "Independent multimodal recommendation experiments"
requires-python = ">=3.10"
dependencies = ["torch>=2.1", "numpy>=1.24", "scipy>=1.10", "PyYAML>=6"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
mmrecsys = "mmrecsys.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
