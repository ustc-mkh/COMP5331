# Fixed MGCN backbone parameters shared by baseline and DAMPS experiments.
# Sources: MMRec/src/configs/model/MGCN.yaml and MMRec/src/models/mgcn.py.
model:
  name: mgcn
  embedding_dim: 256
  n_ui_layers: 2
  n_item_layers: 1
  knn_k: 10
  knn_chunk_size: 512
  knn_self_loops: true
  knn_symmetrize: false
  knn_edge_weight: cosine
  knn_normalization: symmetric
  temperature: 0.2
  # cl_weight corresponds to cl_loss in the original MGCN configuration.
  cl_weight: 0.01
  reg_weight: 0.0001
  fusion: author
  regularization: batch_final
  trainable_features: true
